<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="theme-color" content="#001015" />
    <title>Tasca</title>
    <link rel="stylesheet" href="src/css/style.css" />
    <link rel="stylesheet" href="fonts/phosphor/phosphor.css" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" type="image/png" href="icon.png" />
  </head>
  <body>
    <input
      type="file"
      id="import-picker"
      style="display: none"
      accept=".json"
    />

    <div class="input-line">
      <span class="prompt">❯</span>
      <div class="input-stack">
        <div id="ghost-input" class="ghost"></div>
        <input
          type="text"
          id="cmd-input"
          autofocus
          autocomplete="off"
          autocapitalize="off"
          autocorrect="off"
          spellcheck="false"
          placeholder="add Buy Milk pro:Home !errand"
        />
      </div>
    </div>

    <div id="terminal-output"></div>

    <div id="update-banner" hidden>
      Update available — <a href="#" id="update-link">reload</a>
    </div>

    <!-- Main Entry Point -->
    <script type="module" src="src/js/app.js"></script>

    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("./sw.js")
            .then((registration) => {
              // Listen for new service worker installing
              registration.addEventListener("updatefound", () => {
                const newWorker = registration.installing;
                if (!newWorker) return;

                newWorker.addEventListener("statechange", () => {
                  // New SW is active and there was a previous controller
                  if (
                    newWorker.state === "activated" &&
                    navigator.serviceWorker.controller
                  ) {
                    document.getElementById("update-banner").hidden = false;
                  }
                });
              });
            })
            .catch((err) => console.error("SW registration failed:", err));
        });

        // Reload when user clicks the update link
        document
          .getElementById("update-link")
          .addEventListener("click", (e) => {
            e.preventDefault();
            window.location.reload();
          });
      }
    </script>
  </body>
</html>
