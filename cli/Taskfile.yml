version: "3"

vars:
  BIN: ~/.tasca/tasca

tasks:
  build:
    desc: Build and install the tasca binary to ~/.tasca/tasca
    cmds:
      - mkdir -p ~/.tasca
      - go build -o {{.BIN}} ./cmd/tasca
      - codesign -s - {{.BIN}} || true
      - echo "Installed to {{.BIN}}"

  test:
    desc: Run all tests
    cmds:
      - go test ./... -v -count=1

  install:
    desc: Build binary and copy skill into Claude and Gemini skills directories
    cmds:
      - task: build
      - mkdir -p ~/.claude/skills
      - rm -rf ~/.claude/skills/tasca
      - cp -r ./skills ~/.claude/skills/tasca
      - echo "Installed skill to ~/.claude/skills/tasca"
      - mkdir -p ~/.gemini/skills
      - rm -rf ~/.gemini/skills/tasca
      - cp -r ./skills ~/.gemini/skills/tasca
      - echo "Installed skill to ~/.gemini/skills/tasca"
